# Trusted shell configuration for the FreeBSD host potato.
profile_hostname='potato'
profile_os='FreeBSD'
terminal='st'
window_manager='dwm'
xkb_layout='se'
services=''

# Stow packages.
packages='common bsdinstall bash nvim xkb lf gdb wallpapers'

# BEGIN pkg_packages
pkg_packages='
shells/bash
devel/bear
x11/dmenu
graphics/drm-kmod
sysutils/dunst
sysutils/fastfetch
shells/fd
graphics/feh
lang/gcc
devel/gdb
lang/ghc
devel/git
devel/gmake
sysutils/htop
misc/lf
devel/llvm
sysutils/lsblk
devel/lua-language-server
editors/neovim
x11-fonts/nerd-fonts-noto
ports-mgmt/pkg
devel/pkgconf
textproc/ripgrep
lang/rust
sysutils/stow
security/sudo
sysutils/tree
graphics/viu
x11/xbindkeys
x11/xcape
x11/xclip
x11-wm/xcompmgr
x11-drivers/xf86-video-intel
x11/xorg
x11-toolkits/xwallpaper
'
# END pkg_packages

# BEGIN foreign_packages
foreign_packages='
net/wifi-firmware-iwlwifi-kmod
'
# END foreign_packages
