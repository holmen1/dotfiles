# Trusted shell configuration for the FreeBSD host x1.
profile_hostname='x1'
profile_os='FreeBSD'
terminal='st'
window_manager='dwm'
xkb_layout='se'
services=''

# Stow packages.
packages='common bsdinstall bash nvim xkb lf gdb wallpapers'

# BEGIN pkg_pre
pkg_pre='
shells/bash
graphics/drm-kmod
sysutils/fastfetch
sysutils/stow
security/sudo
x11/xorg
'
# END pkg_pre

# BEGIN pkg_packages
pkg_packages='
shells/bash
devel/bear
ftp/curl
x11/dmenu
graphics/drm-kmod
sysutils/dunst
sysutils/fastfetch
shells/fd
graphics/feh
lang/gcc
devel/gdb
lang/ghc
devel/git
devel/gmake
sysutils/htop
misc/lf
www/librewolf
devel/llvm
sysutils/lsblk
devel/lua-language-server
editors/neovim
ports-mgmt/pkg
devel/pkgconf
textproc/ripgrep
sysutils/stow
security/sudo
sysutils/tree
editors/vim
graphics/viu
x11/xbindkeys
x11/xcape
x11/xclip
x11-wm/xcompmgr
x11/xorg
x11-toolkits/xwallpaper
'
# END pkg_packages

# BEGIN foreign_packages
foreign_packages='
graphics/gpu-firmware-intel-kmod
net/wifi-firmware-iwlwifi-kmod
'
# END foreign_packages
