# Trusted shell configuration for the Artix host besk (Framework).
profile_hostname='besk'
profile_os='Linux'
profile_distribution='artix'
terminal='st'
window_manager='xmonad'
xkb_layout='us'
services='iwd dbus elogind'
ghc_version='9.12.4'
xmonad_version='0.18.1'
xmonad_contrib_version='0.18.2'

packages='xmonad bash nvim xkb common artixinstall lf gdb wallpapers'

# BEGIN pkg_packages
pkg_packages='
acpilight
alsa-utils
artix-archlinux-support
base
base-devel
bash-language-server
bear
cabal-install
clang
cryptsetup
cryptsetup-openrc
dhcpcd
dhcpcd-openrc
dmenu
docker
docker-openrc
dunst
efibootmgr
elogind-openrc
ex-vi-compat
fastfetch
fd
feh
git
grub
htop
iwd
iwd-openrc
jq
less
lf
libnotify
librewolf
linux-firmware
linux-hardened
linux-hardened-headers
llvm
lua-language-server
lvm2
man-db
man-pages
mullvad-vpn-daemon
mullvad-vpn-openrc
neovim
noto-fonts
openrc
openresolv
openssh
pacman-contrib
qemu-system-riscv
ripgrep
rust
scrot
shellcheck-bin
shfmt
stow
strace
tree
viu
xbindkeys
xcape
xclip
xcompmgr
xf86-video-amdgpu
xorg-server
xorg-xev
xorg-xinit
xterm
xwallpaper
'
# END pkg_packages

# BEGIN foreign_packages
foreign_packages='
'
# END foreign_packages
