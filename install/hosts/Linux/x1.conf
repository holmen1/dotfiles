# Trusted shell configuration for the Artix host x1.
profile_hostname='x1'
profile_os='Linux'
profile_distribution='artix'
terminal='st'
window_manager='xmonad'
xkb_layout='se'
services='iwd dbus elogind'
ghc_version='9.12.4'
xmonad_version='0.18.1'
xmonad_contrib_version='0.18.2'

packages='xmonad bash nvim xkb common artixinstall lf gdb wallpapers'

# BEGIN pkg_packages
pkg_packages='
acpilight
alsa-utils
artix-archlinux-support
base
base-devel
bash-language-server
bc
bear
cabal-install
checkbashisms
clang
cryptsetup
cryptsetup-openrc
dash
dhcpcd
dhcpcd-openrc
dmenu
docker
docker-openrc
dunst
efibootmgr
elogind-openrc
ex-vi-compat
fastfetch
fd
feh
git
grub
haskell-language-server
htop
iwd
iwd-openrc
jq
less
lf
libnotify
librewolf
libxinerama
libxss
linux-firmware
linux-hardened
linux-hardened-headers
llvm
lua-language-server
man-db
man-pages
neovim
noto-fonts
openrc
openresolv
openssh
pacman-contrib
qemu-system-riscv
ripgrep
rust
scrot
shellcheck-bin
shfmt
stow
strace
tree
viu
xbindkeys
xcape
xclip
xcompmgr
xf86-input-libinput
xorg-server
xorg-xev
xorg-xinit
xterm
xwallpaper
'
