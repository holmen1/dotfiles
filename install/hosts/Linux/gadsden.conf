# Trusted shell configuration for the Artix host gadsden.
profile_hostname='gadsden'
profile_os='Linux'
profile_distribution='artix'
terminal='st'
window_manager='xmonad'
xkb_layout='se'
services='iwd dbus elogind'
ghc_version='9.12.4'
xmonad_version='0.18.1'
xmonad_contrib_version='0.18.2'

packages='xmonad bash nvim xkb common artixinstall lf gdb wallpapers'

# BEGIN pkg_packages
pkg_packages='
acpilight
alsa-utils
artix-archlinux-support
base
base-devel
bash-language-server
bc
bear
cabal-install
clang
cryptsetup
cryptsetup-openrc
dhcpcd
dhcpcd-openrc
dmenu
docker
docker-openrc
dunst
efibootmgr
elogind-openrc
ex-vi-compat
fastfetch
fd
feh
git
grub
haskell-language-server
htop
iwd
iwd-openrc
less
lf
libnotify
librewolf
libxinerama
libxss
linux-firmware
linux-hardened
linux-hardened-headers
llvm
lua-language-server
lvm2
man-db
man-pages
neovim
noto-fonts
openrc
openresolv
openssh
qemu-system-riscv
ripgrep
rust
scrot
shellcheck-bin
shfmt
sof-firmware
stow
strace
tree
xbindkeys
xcape
xclip
xcompmgr
xlibre-input-libinput
xlibre-xserver
xorg-xev
xorg-xinit
xterm
xwallpaper
'
# END pkg_packages

# BEGIN foreign_packages
foreign_packages='
'
# END foreign_packages
